<!doctype html>
<html><head><meta charset="utf-8"><title>Conductor Chaos art render</title>
<style>html,body{margin:0;background:transparent;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./three/build/three.module.js","three/addons/":"./three/examples/jsm/"}}</script>
</head><body>
<script type="module">
/*
 * Stijlrender voor de P0 art proof.
 * Shader = de 'stylized lit'-aanpak uit Docs/ART_STYLE_GUIDE.md:
 *   lichtintensiteit (Lambert + schaduw) -> zachte 2-staps ramp -> kleur uit de
 *   gemeten 5-tinten-ramp van het materiaal (palette.json), koele rimlight,
 *   brede satijnachtige highlight. Geen tonemapping: de ramps zijn al sRGB.
 * Parameters via de URL (zie scenes in render.mjs).
 */
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

const Q = new URLSearchParams(location.search);
const W = +Q.get('w') || 900, H = +Q.get('h') || 1200;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(+Q.get('ss') || 2);
renderer.setSize(W, H);
renderer.outputColorSpace = THREE.LinearSRGBColorSpace; // wij schrijven sRGB-waarden direct
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const STYLE = {
  noise: +(Q.get('noise') ?? 0),   // 0 = effen low-poly vlakken (gekozen stijl); 1 = gebakken verfvlekken (B) ter vergelijking
  dirt: '#503330',                  // palette wagon_brown[0]: vuil onderin
  key: '#FFE3BC', rim: '#B2C5F3', rimStrength: +(Q.get('rim') || 0.32),
  ground: '#6A4C4B',
  fog: Q.get('fog') || '#91A8E6', fogNear: +(Q.get('fogNear') || 1e5), fogFar: +(Q.get('fogFar') || 2e5),
};

// ------------------------------------------------------------ ramp-materiaal
function hex3(h) { const c = new THREE.Color(); c.setStyle(h, THREE.LinearSRGBColorSpace); return c; }
function rampMaterial(ramp, shift = 0, opts = {}) {
  const m = new THREE.MeshLambertMaterial({ color: 0xffffff, side: opts.side ?? THREE.FrontSide });
  if ((opts.opacity ?? 1) < 1) { m.transparent = true; m.depthWrite = false; }
  m.userData.ramp = ramp;
  m.onBeforeCompile = (sh) => {
    sh.uniforms.uRamp = { value: ramp.map(hex3) };
    sh.uniforms.uShift = { value: shift };
    sh.uniforms.uRim = { value: hex3(STYLE.rim) };
    sh.uniforms.uRimStrength = { value: opts.rim ?? STYLE.rimStrength };
    sh.uniforms.uSpec = { value: opts.spec ?? 0.55 };
    sh.uniforms.uFlat = { value: opts.flat ?? 0.0 };
    sh.uniforms.uFog = { value: hex3(STYLE.fog) };
    sh.uniforms.uFogRange = { value: new THREE.Vector2(STYLE.fogNear, STYLE.fogFar) };
    sh.uniforms.uEmissive = { value: opts.emissive ?? 0.0 };
    sh.uniforms.uHasShade = { value: opts.hasShade ? 1.0 : 0.0 };
    sh.uniforms.uPaint = { value: (opts.paint ?? 1.0) * STYLE.noise };
    sh.uniforms.uEdge = { value: opts.edge ?? 1.0 };
    sh.uniforms.uOpacity = { value: opts.opacity ?? 1.0 };
    sh.uniforms.uCells = { value: opts.emissive ? 0.0 : (opts.cells ?? 1.0) };   // grote vlakken met iets andere tint
    sh.uniforms.uCellSize = { value: opts.cellSize ?? 0.45 };
    sh.uniforms.uGrime = { value: opts.grime ?? 0.0 };                          // onderin viezer
    sh.uniforms.uGrimeY = { value: new THREE.Vector2(...(opts.grimeY ?? [-0.35, 0.85])) };
    sh.uniforms.uDirt = { value: hex3(STYLE.dirt) };
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', `#include <common>
        attribute vec4 color; varying vec4 vShade; varying vec3 vWorldPos;`)
      .replace('#include <fog_vertex>', `#include <fog_vertex>
        vShade = color; vWorldPos = (modelMatrix * vec4(transformed, 1.0)).xyz;`);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
        uniform vec3 uRamp[5]; uniform float uShift; uniform vec3 uFog; uniform vec2 uFogRange; uniform float uEmissive;
        uniform float uOpacity;
        uniform float uCells; uniform float uCellSize; uniform float uGrime; uniform vec2 uGrimeY; uniform vec3 uDirt;
        vec3 hash33(vec3 p){ p = fract(p * vec3(0.1031, 0.1030, 0.0973)); p += dot(p, p.yxz + 33.33);
          return fract((p.xxy + p.yxx) * p.zyx); }
        // Voronoi: id (willekeurig 0..1) en middelpunt van de dichtstbijzijnde cel -> harde, effen vlakken
        vec4 cell3(vec3 p){ vec3 i = floor(p), f = fract(p); float best = 9.; vec3 bc = vec3(0.);
          for (int x=-1;x<=1;x++) for (int y=-1;y<=1;y++) for (int z=-1;z<=1;z++) {
            vec3 g = vec3(x,y,z); vec3 o = hash33(i + g); vec3 d = g + o - f; float dd = dot(d,d);
            if (dd < best) { best = dd; bc = i + g + o; } }
          return vec4(hash33(bc * 1.37 + 0.5).x, bc); }
        uniform float uHasShade; uniform float uPaint; uniform float uEdge; varying vec4 vShade; varying vec3 vWorldPos;
        float hash13(vec3 p){ p = fract(p*0.1031); p += dot(p, p.zyx+31.32); return fract((p.x+p.y)*p.z); }
        float vnoise(vec3 p){ vec3 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
          return mix(mix(mix(hash13(i),hash13(i+vec3(1,0,0)),f.x), mix(hash13(i+vec3(0,1,0)),hash13(i+vec3(1,1,0)),f.x),f.y),
                     mix(mix(hash13(i+vec3(0,0,1)),hash13(i+vec3(1,0,1)),f.x), mix(hash13(i+vec3(0,1,1)),hash13(i+vec3(1,1,1)),f.x),f.y), f.z); } uniform vec3 uRim; uniform float uRimStrength; uniform float uSpec; uniform float uFlat;
        vec3 sampleRamp(float t){ t=clamp(t,0.,1.)*4.; int i=int(min(floor(t),3.)); float f=t-float(i);
          vec3 a=uRamp[0],b=uRamp[1]; if(i==1){a=uRamp[1];b=uRamp[2];} else if(i==2){a=uRamp[2];b=uRamp[3];} else if(i==3){a=uRamp[3];b=uRamp[4];}
          return mix(a,b,f); }`)
      .replace('#include <opaque_fragment>', `
        // outgoingLight.r = NdotL * schaduw voor het witte key-light (geen ambient in de scene)
        float lit = clamp(outgoingLight.r, 0., 1.);
        float band = smoothstep(0.0, 0.5, lit);                  // zachte, geschilderde terminator
        vec3 N = normalize(normal);
        vec3 V = normalize(vViewPosition);
        vec3 upV = normalize((viewMatrix * vec4(0.,1.,0.,0.)).xyz);
        float up = dot(N, upV)*0.5+0.5;                          // hemel-vulling in de schaduw
        float tShadow = mix(0.05, 0.36, up);
        float tLit = mix(0.56, 0.93, up);              // naar boven gerichte vlakken duidelijk lichter (concept)
        vec4 sh4 = uHasShade > 0.5 ? vShade : vec4(1., 0., 0.5, 1.);
        float ao = sh4.r, edgeV = sh4.g, paint = sh4.b;
        band *= mix(0.45, 1.0, smoothstep(0.15, 0.9, ao));        // holtes vallen in de schaduwkant
        float t = mix(tShadow, tLit, band);
        t -= (1. - ao) * 0.17;                                     // occlusie: dieper in de ramp
        t += edgeV * mix(0.05, 0.13, band) * uEdge;                // geschilderde lichte randjes op bevels/facetten
        t += (paint - 0.5) * 0.10 * uPaint;                        // verfvlekken (lage frequentie)
        // grote vlakken die lichtelijk van tint verschillen (cellen in wereldruimte; Unity: objectruimte)
        vec4 cl = cell3(vWorldPos / uCellSize);
        t += (cl.x - 0.5) * 0.10 * uCells;
        // vuil: onderin donkerder en bruiner, per cel (zodat ook het vuil uit vlakken bestaat)
        float cy = mix(vWorldPos.y, cl.w * uCellSize, step(0.001, uCells));
        float grime = (1. - smoothstep(uGrimeY.x, uGrimeY.y, cy + (hash33(cl.yzw).y - 0.5) * 0.45)) * uGrime;
        t -= grime * 0.11;
        #if NUM_DIR_LIGHTS > 0
          vec3 L = directionalLights[0].direction;
          float spec = pow(max(dot(N, normalize(L+V)),0.), 18.) * band;
          t += spec * 0.30 * uSpec;
        #endif
        t = mix(t + uShift, 0.5 + uShift, uFlat);
        vec3 col = sampleRamp(t);
        col = mix(col, uDirt, grime * 0.22);
        col *= 1. + (cl.x - 0.5) * 0.09 * uCells;              // ook zichtbaar op lichte vlakken (ramp-top)
        float fr = pow(1. - max(dot(N, V), 0.), 3.0);
        col = mix(col, uRim, clamp(fr * uRimStrength * (1.15 - band*0.75), 0., 1.));
        // gloeiende lens: midden licht/geel, naar de rand warmer oranje (concept-koplamp)
        col = mix(col, sampleRamp(0.25 + 0.75 * pow(max(dot(N, V), 0.), 0.9) + uShift), uEmissive);
        float fogT = smoothstep(uFogRange.x, uFogRange.y, length(vViewPosition));
        col = mix(col, uFog, fogT * 0.85);
        // glas: doorzichtig, aan de randen (scherende hoek) iets dekkender
        float alpha = uOpacity >= 1.0 ? 1.0 : clamp(uOpacity + fr * 0.45, 0., 1.);
        gl_FragColor = vec4(col, alpha);`);
  };
  return m;
}
window.rampMaterial = rampMaterial;

// --------------------------------------------------------------------- licht
const key = new THREE.DirectionalLight(0xffffff, Math.PI); // Lambert: max = intensiteit/π -> 1.0
const az = THREE.MathUtils.degToRad(+(Q.get('lightAz') ?? 38)), el = THREE.MathUtils.degToRad(+(Q.get('lightEl') ?? 42));
key.position.set(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el)).multiplyScalar(10);
key.castShadow = true;
key.shadow.mapSize.set(4096, 4096);
const sc = +(Q.get('shadowSize') || 3);
Object.assign(key.shadow.camera, { left: -sc, right: sc, top: sc, bottom: -sc, near: 0.1, far: 40 });
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.012; key.shadow.radius = 3;
scene.add(key); scene.add(key.target);
// lichtrichting is t.o.v. de camera-kijkrichting wanneer 'lightRel' gezet is
// ------------------------------------------------------------------- camera
const cam = new THREE.PerspectiveCamera(+(Q.get('fov') || 22), W / H, 0.05, 200);
const tgt = (Q.get('target') || '0,0.62,0').split(',').map(Number);
const yaw = THREE.MathUtils.degToRad(+(Q.get('yaw') || 0)), pitch = THREE.MathUtils.degToRad(+(Q.get('pitch') || 4));
const dist = +(Q.get('dist') || 4.2);
cam.position.set(tgt[0] + Math.sin(yaw) * Math.cos(pitch) * dist, tgt[1] + Math.sin(pitch) * dist, tgt[2] + Math.cos(yaw) * Math.cos(pitch) * dist);
cam.lookAt(...tgt);
if (Q.get('ortho')) {
  const hh = +Q.get('ortho');
  const oc = new THREE.OrthographicCamera(-hh * W / H, hh * W / H, hh, -hh, 0.05, 200);
  oc.position.copy(cam.position); oc.quaternion.copy(cam.quaternion);
  window.__cam = oc;
}
if (Q.get('lightRel')) { // licht meedraaien met de camera (turnarounds: steeds dezelfde belichting)
  const v = key.position.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
  key.position.copy(v);
}

// --------------------------------------------------------------- grond/achtergrond
if (Q.get('ground') !== '0') {
  const g = new THREE.Mesh(new THREE.CircleGeometry(+(Q.get('groundR') || 1.4), 64), rampMaterial(JSON.parse(Q.get('groundRamp') || '["#2A2730","#302629","#33303B","#403E4B","#4A4852"]'), -0.05, { rim: 0, spec: 0 }));
  g.rotation.x = -Math.PI / 2; g.receiveShadow = true; scene.add(g);
  if (Q.get('groundShadowOnly')) { g.material = new THREE.ShadowMaterial({ color: new THREE.Color('#1c1922'), opacity: 0.55 }); }
}

// ------------------------------------------------------------------- laden
async function loadAsset(url) {
  if (url.endsWith('.fbx')) return await new FBXLoader().loadAsync(url);
  return (await new GLTFLoader().loadAsync(url)).scene;
}
function applyRampMaterials(root, matsJson) {
  root.traverse(o => {
    if (!o.isMesh) return;
    o.castShadow = true; o.receiveShadow = true;
    const convert = (m) => {
      const info = (m.userData && m.userData.ramp) ? { ramp: m.userData.ramp, rampShift: m.userData.rampShift || 0, opts: m.userData.opts } : matsJson?.[m.name];
      if (!info) return m;
      if (info.opts && info.opts.noShadow) o.receiveShadow = false;
      if (info.opts && (info.opts.opacity ?? 1) < 1) o.castShadow = false;
      const o2 = Object.assign({}, info.opts || {}, { hasShade: !!o.geometry.attributes.color });
      const rm = rampMaterial(info.ramp, info.rampShift || 0, o2);
      rm.name = m.name; return rm;
    };
    o.material = Array.isArray(o.material) ? o.material.map(convert) : convert(o.material);
  });
}
function setPose(root, pose) {
  for (const [name, p] of Object.entries(pose || {})) {
    const o = root.getObjectByName(name); if (!o) { console.log('pose: geen node', name); continue; }
    if (p.visible !== undefined) o.visible = p.visible;
    if (p.rot) o.rotation.set(...p.rot.map(THREE.MathUtils.degToRad), 'XYZ');
    if (p.addRot) { o.rotation.x += THREE.MathUtils.degToRad(p.addRot[0]); o.rotation.y += THREE.MathUtils.degToRad(p.addRot[1]); o.rotation.z += THREE.MathUtils.degToRad(p.addRot[2]); }
    if (p.pos) o.position.set(...p.pos);
    if (p.addPos) o.position.add(new THREE.Vector3(...p.addPos));
    if (p.scale) o.scale.set(...p.scale);
  }
}

(async () => {
  try {
    const items = JSON.parse(Q.get('items') || '[{"url":"../Exports/Conductor.glb"}]');
    for (const it of items) {
      const root = await loadAsset(it.url);
      if (it.mats) applyRampMaterials(root, await (await fetch(it.mats)).json().then(j => j.materials || j));
      else applyRampMaterials(root, null);
      if (it.unitScale) root.scale.setScalar(it.unitScale);
      // glTF: verborgen nodes (extras.hidden) verbergen
      root.traverse(o => { if (o.userData && o.userData.hidden) o.visible = false; });
      if (it.pos) root.position.set(...it.pos);
      if (it.rotY) root.rotation.y = THREE.MathUtils.degToRad(it.rotY);
      scene.add(root);
      scene.updateMatrixWorld(true);
      setPose(root, it.pose);
      for (const [name, target] of Object.entries(it.aim || {})) {   // richt lokale -Y van een node op een wereldpunt
        const o = root.getObjectByName(name); o.parent.updateMatrixWorld(true);
        const from = o.getWorldPosition(new THREE.Vector3());
        const dirW = new THREE.Vector3(...target).sub(from).normalize();
        const pq = o.parent.getWorldQuaternion(new THREE.Quaternion()).invert();
        const dirL = dirW.applyQuaternion(pq);
        o.quaternion.setFromUnitVectors(new THREE.Vector3(0, -1, 0), dirL);
        o.updateMatrixWorld(true);
      }
    }
    if (window.extraScene) await window.extraScene(scene, THREE, rampMaterial);
    renderer.render(scene, window.__cam || cam);
    let tris = 0; scene.traverse(o => { if (o.isMesh && o.visible) tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; });
    window.done = JSON.stringify({ tris });
  } catch (e) { console.log('ERR', e.stack || e); window.done = 'error'; }
})();
</script></body></html>
